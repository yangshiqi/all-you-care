name: ai · publish-pipeline
on:
  schedule:
    - cron: '30 0 * * *'        # 08:30 Asia/Shanghai (UTC+8), daily morning paper
  workflow_dispatch: {}

jobs:
  merge:
    uses: ./.github/workflows/_pipeline.yml
    with: { channel: ai, step: merge }
    secrets: inherit
  render:
    needs: merge
    uses: ./.github/workflows/_pipeline.yml
    with: { channel: ai, step: render }
    secrets: inherit
  publish:
    needs: render
    uses: ./.github/workflows/_pipeline.yml
    with: { channel: ai, step: publish }
    secrets: inherit
  deliver:
    needs: publish
    uses: ./.github/workflows/_pipeline.yml
    with: { channel: ai, step: deliver }
    secrets: inherit
