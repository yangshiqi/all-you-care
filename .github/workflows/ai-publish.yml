name: ai · publish-pipeline
on:
  # Scheduled by cron-job.org at 30 0 * * * UTC = 08:30 Asia/Shanghai
  # (see pipeline/scripts/cron-fallback.md).
  workflow_dispatch: {}

jobs:
  merge:
    uses: ./.github/workflows/_pipeline.yml
    with: { channel: ai, step: merge }
    secrets: inherit
  render:
    needs: merge
    uses: ./.github/workflows/_pipeline.yml
    with: { channel: ai, step: render }
    secrets: inherit
  publish:
    needs: render
    uses: ./.github/workflows/_pipeline.yml
    with: { channel: ai, step: publish }
    secrets: inherit
  # TEMPORARILY PAUSED 2026-05-21 — preview-first day. publish step still sends
  # a [PREVIEW] copy to PREVIEW_EMAIL_TO; subscriber broadcast is gated below.
