name: pipeline-ci
on:
  pull_request:
    paths:
      - 'pipeline/**'
      - '.github/workflows/_pipeline.yml'
      - '.github/workflows/pipeline-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: pipeline/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
