name: pipeline-step
on:
  workflow_call:
    inputs:
      channel:
        type: string
        required: true
      step:
        type: string
        required: true
      flags:
        type: string
        default: ""

jobs:
  run:
    # Allow schedule events unconditionally (they only fire on default branch)
    # and explicit dispatches against main. Skip dispatches against feature branches.
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - name: debug context
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "ref_name=${{ github.ref_name }}"
          echo "channel=${{ inputs.channel }} step=${{ inputs.step }}"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: pipeline/package-lock.json
      - run: npm ci
      - name: Run pipeline step
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: npm run cli -- ${{ inputs.channel }} ${{ inputs.step }} ${{ inputs.flags }}
